name: Deploy Node Application

on:
  push:
    branches:
      - dev1Backend  # Fixed: removed space after hyphen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        
      - name: Login to Docker Hub
        run: docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
        
      - name: Build Docker Image
        run: docker build -t jashwanth2253/deverecare_nodejs:latest .
        
      - name: Publish Image to Docker Hub
        run: docker push jashwanth2253/deverecare_nodejs:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Pull image from Docker Hub
        run: docker pull jashwanth2253/deverecare_nodejs:latest
        
      - name: Stop and remove existing container
        run: |
          docker stop nodejs-app-container || true
          docker rm nodejs-app-container || true
          
      - name: Run Docker Container
        run: |
          docker run -d \
            -p 5000:5000 \
            --name nodejs-app-container \
            -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
            -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            -e VALID_USERNAME="${{ secrets.VALID_USERNAME }}" \
            -e VALID_PASSWORD="${{ secrets.VALID_PASSWORD }}" \
            jashwanth2253/deverecare_nodejs:latest
